apiVersion: v1
kind: Service
metadata:
  name: "{{ include "helloapp.name" . }}"
  labels:
{{ include "helloapp.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
{{ include "helloapp.matchLabels" . | indent 4 }}